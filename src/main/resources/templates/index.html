<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Películas</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        h1, h2, h3 {
            text-align: center;
            color: #4CAF50;
        }

        h1 {
            margin-top: 30px;
        }

        /* Contenedor principal */
        div {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Formulario de agregar película */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 60%;
            margin: 20px auto;
        }

        input[type="text"], input[type="number"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Estilo de la tabla */
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<h1>Listado de Películas</h1>

<div>
    <h2>Agregar Película</h2>
    <form action="/add-movie" method="post">
        <input type="text" name="name" placeholder="Nombre de la película" required>
        <input type="text" name="director" placeholder="Director" required>
        <input type="number" name="year" placeholder="Año" required>
        <button type="submit">Agregar</button>
    </form>
</div>

<h3>Películas Disponibles</h3>
<table>
    <tr>
        <th>Nombre</th>
        <th>Director</th>
        <th>Año</th>
        <th>Acciones</th>
    </tr>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.name}"></td>
        <td th:text="${movie.director}"></td>
        <td th:text="${movie.year}"></td>
        <td>
            <a th:href="@{/update-movie/{id}(id=${movie.id})}">Actualizar</a> |
            <a th:href="@{/delete-movie/{id}(id=${movie.id})}">Eliminar</a>
        </td>
    </tr>
</table>
</body>
</html>
