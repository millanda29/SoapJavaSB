<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Actualizar Película</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        /* Formulario de actualización */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 60%;
            margin: 20px auto;
        }

        input[type="text"], input[type="number"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #2196F3;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1976D2;
        }

        /* Enlace para volver */
        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2196F3;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Actualizar Película</h1>

<form th:action="@{/update-movie}" method="post">
    <input type="hidden" name="id" th:value="${movie.id}"/>  <!-- Campo oculto para el id -->

    <label for="name">Nombre:</label>
    <input type="text" id="name" name="name" th:value="${movie.name}" required/><br>

    <label for="director">Director:</label>
    <input type="text" id="director" name="director" th:value="${movie.director}" required/><br>

    <label for="year">Año:</label>
    <input type="number" id="year" name="year" th:value="${movie.year}" required/><br>

    <button type="submit">Actualizar</button>
</form>

<a href="/">Volver a la lista</a>

</body>
</html>
